<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Remplacé par la valeur de `--base-href` au `flutter build web`
    (« /Cognicquest/ » sur GitHub Pages). Doit commencer et finir par « / ».
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    Politique de sécurité du contenu. GitHub Pages ne permet pas d'en-têtes
    HTTP : elle est donc posée ici (frame-ancestors, inopérant en <meta>, est
    omis).
    - script-src : 'wasm-unsafe-eval' pour CanvasKit et sqlite3.wasm ; aucun
      script en ligne exécutable (le JSON-LD n'est pas exécuté).
    - style-src 'unsafe-inline' : Flutter injecte ses styles au démarrage.
    - connect-src : API, temps réel et Storage Supabase ; polices de repli.
    - img-src https: : les images collées par lien dans les fiches.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https:;
    media-src 'self' blob: https:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.gstatic.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- SEO -->
  <title>CognicQuest — Apprendre mieux grâce à la métacognition</title>
  <meta name="description" content="CognicQuest, l'espace d'étude qui t'apprend à apprendre : fiches, révision espacée (méthode des J), Pomodoro, habitudes, planification et journal métacognitif. Hors ligne, synchronisé.">
  <meta name="keywords" content="métacognition, révision espacée, méthode des J, flashcards, Pomodoro, fiches de révision, prépa, médecine, organisation des études">
  <meta name="author" content="CognicQuest">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://nmns42.github.io/Cognicquest/">

  <!-- Open Graph / réseaux sociaux -->

  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="CognicQuest">
  <meta property="og:title" content="CognicQuest — Apprendre mieux grâce à la métacognition">
  <meta property="og:description" content="Fiches, révision espacée, Pomodoro, habitudes et journal métacognitif réunis dans un seul espace d'étude, même hors ligne.">
  <meta property="og:url" content="https://nmns42.github.io/Cognicquest/">
  <meta property="og:image" content="https://nmns42.github.io/Cognicquest/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logo CognicQuest : un arbre dont le feuillage est un réseau de neurones">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CognicQuest">
  <meta name="twitter:description" content="L'espace d'étude qui t'apprend à apprendre.">
  <meta name="twitter:image" content="https://nmns42.github.io/Cognicquest/icons/Icon-512.png">

  <script type="application/ld+json">

    "@context": "https://schema.org",

    "name": "CognicQuest",
    "url": "https://nmns42.github.io/Cognicquest/",
    "applicationCategory": "EducationalApplication",

    "description": "Espace d'étude métacognitif : fiches, révision espacée (méthode des J), Pomodoro, habitudes, planification SMART et journal de réflexion, utilisable hors ligne.",
    "image": "https://nmns42.github.io/Cognicquest/icons/Icon-512.png",

      "priceCurrency": "EUR"
    },

  <!-- Application installable (PWA, iOS, Android) -->

  <meta name="apple-mobile-web-app-capable" content="yes">
