name: Déploiement web (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Filet avant tout déploiement : analyse statique et tests doivent passer.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Goldens exclus : leurs images de référence sont générées sous Windows.
      # `pdfium` exclu : le moteur PDF natif n'est pas fourni au runner de
      # test Linux (ces tests tournent en local).
      # Sans DEV_BYPASS_AUTH, la recette test/e2e est ignorée.
      - run: flutter test --exclude-tags "golden || pdfium"

      # Recette de bout en bout, en mode démo (aucun appel serveur).
      - run: flutter test --dart-define=DEV_BYPASS_AUTH=true test/e2e

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - run: flutter pub get

      # Garde-fou de mise en ligne : mentions légales complètes (LCEN).
      - name: Mentions légales complètes
        run: flutter test --dart-define=CQ_RELEASE=true test/features/legal/legal_release_guard_test.dart

      # env.json n'est pas versionné : les valeurs viennent des secrets du
      # dépôt (Settings > Secrets and variables > Actions).
      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          # CanvasKit servi par l'app (et non le CDN gstatic) : condition
          # du mode hors ligne et de la CSP sans origine tierce.
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href="/Cognicquest/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          dart run tool/generate_service_worker.dart build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
