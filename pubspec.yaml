name: cognicquest
description: "Application d'apprentissage cognitif basée sur la métacognition (MVP)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Backend & Authentification
  supabase_flutter: ^2.5.4
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_markdown_plus: ^1.0.12
  audioplayers: ^6.8.1

  # ──────────────────────────────────────────────────────────────────────────
  # Base locale : arbitrage tranché au Lot 4 en faveur de Drift/SQLite.
  #   - Sur mobile/desktop : fichier SQLite natif.
  #   - Sur le web : sqlite3.wasm + drift_worker.js, versionnés dans `web/`
  #     (OPFS ou IndexedDB selon le navigateur). Ces deux fichiers doivent
  #     rester alignés sur la version de `drift` ci-dessus.
  # ──────────────────────────────────────────────────────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1
  sqlite3: ^3.5.2
  # MockClient : simule PostgREST dans les tests de synchronisation.
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  # Atkinson Hyperlegible Next (OFL, cf. OFL.txt à côté des fichiers) :
  # embarquée pour fonctionner hors ligne, sans téléchargement au lancement.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
