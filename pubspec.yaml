name: cognicquest
description: "Application d'apprentissage cognitif basée sur la métacognition (MVP)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Textes des composants (sélecteurs de date et d'heure, cadrans,
  # infobulles) en français.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Backend & Authentification
  supabase_flutter: ^2.5.4
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_markdown_plus: ^1.0.12
  # Syntaxes Markdown propres aux fiches (souligné, surligné).
  markdown: ^7.3.0
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  video_player: ^2.14.1
  archive: ^4.5.2
  # Consentement RGPD : mémorisé avant toute connexion, hors base locale
  # (effacée à la déconnexion).
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  pdf: ^3.13.1
  printing: ^5.15.1
  pdfrx: ^2.4.8

  # ──────────────────────────────────────────────────────────────────────────
  # Base locale : arbitrage tranché au Lot 4 en faveur de Drift/SQLite.
  #   - Sur mobile/desktop : fichier SQLite natif.
  #   - Sur le web : sqlite3.wasm + drift_worker.js, versionnés dans `web/`
  #     (OPFS ou IndexedDB selon le navigateur). Ces deux fichiers doivent
  #     rester alignés sur la version de `drift` ci-dessus.
  # ──────────────────────────────────────────────────────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Tests sur appareil réel (integration_test/) : flutter test integration_test -d <id>
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1
  sqlite3: ^3.5.2
  # MockClient : simule PostgREST dans les tests de synchronisation.
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  # Plus Jakarta Sans (OFL, cf. OFL.txt à côté des fichiers) : embarquée pour
  # fonctionner hors ligne, sans téléchargement au lancement.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
    # Fraunces (OFL, cf. OFL.txt) : serif éditoriale des titres et du logo.
    # Embarquée (pas de google_fonts) : l'app fonctionne hors ligne.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
        - asset: assets/fonts/fraunces/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/fraunces/Fraunces-SemiBold.ttf
          weight: 600
    # Noto Sans (OFL, cf. OFL.txt) : police de secours des PDF exportés —
    # lettres grecques, cyrillique, flèches que les deux polices de l'app
    # ne couvrent pas.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Regular.ttf
