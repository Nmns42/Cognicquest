# Étiquettes des tests.
tags:
  # Images de référence générées sous Windows : le rendu du texte diffère sous
  # Linux, donc la CI les exclut (`--exclude-tags golden`). À lancer en local.
  golden:
  # Générateurs (icônes…) rangés dans `tool/` : jamais lancés par la suite.
  tool:
  # Moteur PDF natif (PDFium) requis : lancé en local, exclu de la CI Linux.
  pdfium:
